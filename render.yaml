# Deploy the local three-role project, not the previous repository backend.
services:
  - type: web
    name: 18wheelers-jobs
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: EW_HOST
        value: 0.0.0.0
      - key: EW_DATA_DIR
        value: /data
      - key: EW_SECURE_COOKIES
        value: "1"
      - key: EW_DB_SCHEMA
        value: app_private
      - key: EW_DB_POOL_SIZE
        value: "3"
      - key: EW_PHOTO_STORAGE
        value: r2
      - key: DATABASE_URL
        sync: false
      - key: EW_R2_BUCKET
        sync: false
      - key: EW_R2_ENDPOINT_URL
        sync: false
      - key: EW_R2_ACCESS_KEY_ID
        sync: false
      - key: EW_R2_SECRET_ACCESS_KEY
        sync: false
